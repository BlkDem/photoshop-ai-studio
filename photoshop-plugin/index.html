<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photoshop AI Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div class="panel__title">
          <span class="panel__name">Photoshop AI Studio</span>
          <span id="status" class="badge badge--off" role="status" aria-live="polite">● Connecting…</span>
        </div>
        <div class="panel__meta">
          <span id="endpoint" class="mono dim">ws://localhost:3002/bridge</span>
          <span id="host" class="mono dim"></span>
        </div>
      </header>

      <section class="panel__body">
        <label class="field">
          <span class="field__label">Bridge URL</span>
          <input id="bridge-url" type="text" spellcheck="false" class="mono" />
        </label>

        <label class="field">
          <span class="field__label">Workspace root</span>
          <input id="workspace-root" type="text" spellcheck="false" class="mono" />
        </label>

        <div id="last-error" class="notice notice--error" hidden></div>

        <dl class="stats">
          <div class="stats__row"><dt>Documents</dt><dd id="stat-docs">–</dd></div>
          <div class="stats__row"><dt>Active</dt><dd id="stat-active">–</dd></div>
          <div class="stats__row"><dt>Latency</dt><dd id="stat-latency">–</dd></div>
          <div class="stats__row"><dt>Ops served</dt><dd id="stat-ops">0</dd></div>
        </dl>

        <p class="hint">
          The plugin holds no model and no logic about editing. It executes the
          validated operations the MCP server sends, inside Photoshop's own modal
          scope.
        </p>
      </section>

      <footer class="panel__footer">
        <button id="toggle" type="button" class="btn btn--primary">Connect</button>
        <button id="ping" type="button" class="btn" disabled>Ping</button>
        <button id="save-config" type="button" class="btn" disabled>Save config</button>
      </footer>
    </main>

    <!-- Loaded first: `entrypoints.setup` must be called synchronously. -->
    <script src="index.js"></script>
  </body>
</html>
